<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0F1E" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PCR Clock" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
<title>PCR Session Clock</title>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "recharts": "https://esm.sh/recharts@2.12.7?deps=react@18.3.1,react-dom@18.3.1"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>html,body,#root{height:100%;margin:0;background:#0A0F1E;overflow-x:clip;-webkit-text-size-adjust:100%;}</style>
</head>
<body>
<div id="root">Loading…</div>
<script src="./pwa.js"></script>
<script type="module">
  const res = await fetch("./main.jsx", { cache: "no-store" });
  const src = await res.text();
  const { code } = Babel.transform(src, { presets: ["react"], filename: "main.jsx", sourceType: "module" });
  const blob = new Blob([code], { type: "text/javascript" });
  const url = URL.createObjectURL(blob);
  const [{ default: App }, React, { createRoot }] = await Promise.all([
    import(url),
    import("react"),
    import("react-dom/client"),
  ]);
  createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
